name: Kafka vs Kafgres Benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - baseline
          - full
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Sequential benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare Kafgres
        run: bash ./scripts/setup.sh
      - name: Run Kafka
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "push" ]; then
  MODE=baseline
else
  MODE="${{ inputs.mode }}"
fi
          ./scripts/run.sh "$MODE" kafka
      - name: Run Kafgres
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "push" ]; then
  MODE=baseline
else
  MODE="${{ inputs.mode }}"
fi
          ./scripts/run.sh "$MODE" kafgres
      - name: Capture runner metadata
        if: always()
        run: |
          mkdir -p results
          echo "github_sha=${{ github.sha }}" > results/runner.txt
          echo "github_ref=${{ github.ref }}" >> results/runner.txt
          echo "runner_os=${{ runner.os }}" >> results/runner.txt
          echo "runner_arch=${{ runner.arch }}" >> results/runner.txt
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> results/runner.txt
          uname -a >> results/runner.txt
          nproc >> results/runner.txt
          free -h >> results/runner.txt
          df -h >> results/runner.txt
      - name: Generate comparison report
        if: always()
        run: python benchmark/report.py --results results --output results/summary.md
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-vs-kafgres-${{ github.sha }}
          path: results/
          if-no-files-found: error
          retention-days: 90
      - name: Stop brokers
        if: always()
        run: |
          bash ./scripts/stop.sh kafka || true
          bash ./scripts/stop.sh kafgres || true

  publish-release:
    name: Publish benchmark results
    if: github.event_name == 'release'
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: kafka-vs-kafgres-${{ github.run_id }}
          path: release-results
      - name: Create release bundle
        run: tar -czf "kafka-vs-kafgres-${{ github.event.release.tag_name }}.tar.gz" -C release-results .
      - name: Upload bundle and report
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "kafka-vs-kafgres-$TAG.tar.gz" "release-results/summary.md" --clobber
